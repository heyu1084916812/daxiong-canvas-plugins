<button id="agentToggle" class="agent-toggle" type="button" data-canvas-interactive="true"><i data-lucide="bot"></i><span data-i18n="smart.agentPanel">设计大师</span></button>
<button id="smartSendAgentBtn" class="minimap-arrange-btn canvas-agent-send-selected" type="button" data-canvas-interactive="true" title="发送至设计大师" aria-label="发送至设计大师" hidden><i data-lucide="bot"></i><span>发送至设计大师</span></button>
        <aside id="agentPanel" class="agent-panel" data-canvas-interactive="true">
            <div class="agent-dock-resizer" id="agentDockResizer" title="拖拽调整宽度"></div>
            <div class="asset-head">
                <div class="asset-title"><i data-lucide="bot"></i><span data-i18n="smart.agentPanel">设计大师</span><small class="agent-brand-subtitle">你的画布助手</small></div>
                <button id="agentNewChatBtn" class="asset-mini-btn" type="button" title="新建对话"><i data-lucide="plus"></i></button>
                <button id="agentChatListBtn" class="asset-mini-btn" type="button" title="对话列表"><i data-lucide="list"></i></button>
                <div class="agent-more-wrap">
                    <button id="agentMoreBtn" class="asset-mini-btn" type="button" title="更多操作"><i data-lucide="more-horizontal"></i></button>
                    <div id="agentMorePanel" class="agent-more-panel" hidden>
                        <button id="agentDeleteChatBtn" class="agent-more-item" type="button"><i data-lucide="trash-2"></i><span>删除当前对话</span></button>
                    </div>
                </div>
                <button id="agentCloseBtn" class="asset-mini-btn" type="button" title="关闭侧栏"><i data-lucide="x"></i></button>
            </div>
            <div class="agent-models" style="display:none">
                <select id="agentChatProvider" class="agent-select"></select>
                <select id="agentChatModel" class="agent-select"></select>
                <select id="agentGenProvider" class="agent-select"></select>
                <select id="agentGenModel" class="agent-select"></select>
                <select id="agentGenRatio" class="agent-select">
                    <option value="square">1:1</option>
                    <option value="portrait">2:3</option>
                    <option value="portrait43">3:4</option>
                    <option value="portrait45">4:5</option>
                    <option value="landscape43">4:3</option>
                    <option value="landscape">3:2</option>
                    <option value="story">9:16</option>
                    <option value="wide">16:9</option>
                    <option value="ultrawide">21:9</option>
                    <option value="ultratall">9:21</option>
                </select>
                <select id="agentGenResolution" class="agent-select">
                    <option value="1k">1K</option>
                    <option value="2k">2K</option>
                    <option value="4k">4K</option>
                </select>
                <select id="agentGenCount" class="agent-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
            <div id="agentChatListPanel" class="agent-chat-list-panel" hidden></div>
            <section id="agentSkillManager" class="agent-skill-manager" hidden>
                <div class="agent-skill-manager-head"><strong>Skill 预设</strong><button id="agentSkillManagerClose" type="button" title="关闭"><i data-lucide="x"></i></button></div>
                <div class="agent-skill-editor">
                    <input id="agentSkillName" type="text" maxlength="80" placeholder="Skill 名称，例如：电商主图">
                    <input id="agentSkillDescription" type="text" maxlength="300" placeholder="简短说明（可选）">
                    <textarea id="agentSkillContent" rows="7" maxlength="100000" placeholder="输入需要 Agent 始终遵循的完整 Skill 指令……"></textarea>
                    <div class="agent-skill-editor-actions"><button id="agentSkillCancelEdit" type="button">清空</button><button id="agentSkillSave" class="primary" type="button">保存 Skill</button></div>
                </div>
                <div class="agent-skill-list-title"><span>已保存</span><small>输入 / 可快速调用</small></div>
                <div id="agentSkillPresetList" class="agent-skill-preset-list"></div>
            </section>
            <div id="agentMessages" class="agent-messages"></div>
            <div class="agent-input-area">
                <div class="agent-onebox">
                    <div id="agentAttachRow" class="agent-attach-row"></div>
                    <div id="agentInput" class="agent-input-editor" contenteditable="true" role="textbox" aria-multiline="true" data-i18n-placeholder="smart.agentPlaceholder" data-placeholder="输入需求，/ 调用 Skill；点画布图片可插入图片字符..."></div>
                    <div class="agent-toolbar">
                        <div class="agent-toolbar-left">
                            <div id="agentInputModeSwitch" class="agent-input-mode-switch" role="group" aria-label="输入模式">
                                <button type="button" class="agent-input-mode-btn active" data-agent-input-mode="agent" aria-pressed="true"><i data-lucide="bot"></i><span>设计大师</span></button>
                                <button type="button" class="agent-input-mode-btn" data-agent-input-mode="image" aria-pressed="false"><i data-lucide="image"></i><span>图像</span></button>
                            </div>
                            <button id="agentAttachBtn" class="agent-toolbar-icon" type="button" data-i18n-title="smart.agentAttach" title="添加图片或 Skill"><i data-lucide="paperclip"></i></button>
                            <div class="agent-toolbar-dropdown-wrap">
                                <button id="agentModelBtn" class="agent-toolbar-icon agent-model-icon-btn" type="button" title="模型选择">
                                    <i data-lucide="sparkles" class="agent-chip-icon"></i>
                                    <span id="agentModelLabel" class="sr-only">模型</span>
                                </button>
                                <div id="agentModelPanel" class="agent-dropdown-panel agent-model-panel" hidden>
                                    <div class="agent-dropdown-row" data-agent-chat-model-row><label>理解</label><div class="agent-dropdown-selects" id="agentChatModelSelects"></div></div>
                                    <div class="agent-dropdown-row"><label>生图</label><div class="agent-dropdown-selects" id="agentGenSelects"></div></div>
                                    <div class="agent-model-default-row">
                                        <button id="agentSaveModelDefaultsBtn" class="agent-quick-btn primary" type="button">设为默认</button>
                                        <span id="agentModelDefaultHint" class="agent-model-default-hint">可设为默认，下次打开自动使用</span>
                                    </div>
                                </div>
                            </div>
                            <button id="agentSkillManagerBtn" class="agent-toolbar-chip agent-skill-chip" type="button" title="Skill 预设">
                                <i data-lucide="book-open" class="agent-chip-icon"></i>
                                <span>Skills</span>
                                <i data-lucide="chevron-down"></i>
                            </button>
                            <button id="agentRunModeBtn" class="agent-toolbar-chip agent-runmode-chip is-auto" type="button" data-mode="auto" title="全自动：理解后直接规划并执行（全托管）" aria-pressed="false">
                                <i data-lucide="bot" class="agent-chip-icon"></i>
                                <span data-run-mode-label>全自动</span>
                            </button>
                        </div>
                        <div class="agent-toolbar-right">
                            <button id="agentSendBtn" class="agent-send-btn" type="button" data-i18n-title="smart.agentSend" title="发送"><i data-lucide="send"></i></button>
                        </div>
                    </div>
                </div>
                <div id="agentSkillSlashPanel" class="agent-mention-panel agent-skill-slash-panel" hidden></div>
                <div class="agent-input-resize" id="agentInputResize"></div>
            </div>
            <input id="agentImageInput" type="file" accept="image/*,.md,.markdown,.txt" multiple hidden>
            <div id="agentRefConfirmPanel" class="agent-ref-confirm" hidden>
                <div class="agent-ref-confirm-head">
                    <span class="agent-ref-confirm-title">参考图任务确认</span>
                    <button id="agentRefConfirmCancel" class="agent-ref-confirm-close" type="button"><i data-lucide="x"></i></button>
                </div>
                <div class="agent-ref-confirm-body" id="agentRefConfirmBody"></div>
                <div class="agent-ref-confirm-actions">
                    <button id="agentRefConfirmNo" class="agent-ref-confirm-btn secondary" type="button">取消</button>
                    <button id="agentRefConfirmYes" class="agent-ref-confirm-btn primary" type="button">确认生成</button>
                </div>
            </div>
        </aside>
